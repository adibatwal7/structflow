[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "structflow"
requires-python = ">=3.12"
version = "0.1.0"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.7",
    "pydantic-settings>=2.3"
]


[project.optional-dependencies]
dev = ["pytest>=8", "ruff", "mypy", "jsonschema>=4.23", "httpx2"]

[tool.hatch.build.targets.wheel]
packages = ["src/structflow"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]