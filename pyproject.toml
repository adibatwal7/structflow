[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "structflow"
requires-python = ">=3.12"
version = "0.1.0"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "httpx2>=2.13",
    "jsonschema>=4.23",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff", "mypy", "pytest-timeout>=2.3", "types-jsonschema"]
ml = ["torch>=2.9", "transformers>=5.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/structflow"]

[tool.pytest.ini_options]
testpaths = ["tests"]
timeout = 10

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]
enable_error_code = ["possibly-undefined"]
files = ["src"]