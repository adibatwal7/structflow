# Every push and pull request: lint, type-check and test on two Python versions,
# then build the Docker image and check that it actually answers a request.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    name: checks (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install (CPU-only torch keeps the download small)
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e ".[dev,ml]"
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
      - name: Type-check
        run: |
          python -m mypy src
      - name: Test
        run: |
          pytest tests/ 

  docker:
    name: docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate compose.yaml
        run: |
          docker compose config --quiet
          docker compose --profile gpu config --quiet
      - name: Build the image
        run: docker build -t structflow:ci .
      - name: Smoke-test the container
        run: |
          docker run -d --name structflow -p 8080:8080 structflow:ci
          for i in $(seq 1 30); do
            curl -sf localhost:8080/readyz && break
            sleep 1
          done
          curl -sf localhost:8080/v1/infer -H "Content-Type: application/json" \
            -d '{"task":"classify","text":"great film","labels":["great","awful"]}'
          curl -sf localhost:8080/metrics | grep structflow_requests_total
      - name: Show the container log if anything failed
        if: failure()
        run: docker logs structflow
